name: Alert BTC - RSI EMA MACD

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Invia solo un messaggio di prova"
        type: boolean
        default: false

concurrency:
  group: alerts
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ripristina lo stato degli alert
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Controlla gli alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 alerts.py ${{ inputs.test && '--test' || '' }}

      - name: Salva alerts.json se cambiato
        if: always()
        run: |
          if ! git diff --quiet alerts.json; then
            git config user.name "alert-bot"
            git config user.email "alert-bot@users.noreply.github.com"
            git add alerts.json
            git commit -m "Aggiorna alert da Telegram"
            git push
          fi
